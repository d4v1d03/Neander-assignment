[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neai"
version = "0.2.0"
description = "A small local app platform for coding agents (Neander take-home)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
neai = "neai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neai.ui" = ["static/*.html"]
"neai.appui" = ["*.js", "*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
