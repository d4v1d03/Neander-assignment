[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neai"
version = "0.1.0"
description = "A small local app platform for coding agents (Neander take-home)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
neai = "neai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neai.ui" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
