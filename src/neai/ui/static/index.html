<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neai</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d8dee4; --card: #f6f8fa;
    --accent: #0969da; --accent-fg: #ffffff; --ok: #1a7f37; --ok-bg: #dafbe1;
    --err: #cf222e; --err-bg: #ffebe9; --warn: #9a6700; --warn-bg: #fff8c5; --info-bg: #ddf4ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --card: #161b22;
      --accent: #4493f8; --accent-fg: #0d1117; --ok: #3fb950; --ok-bg: #12261e;
      --err: #f85149; --err-bg: #2d1214; --warn: #d29922; --warn-bg: #272115; --info-bg: #121d2f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 16px; color: var(--fg); text-decoration: none; }
  .spacer { flex: 1; }
  #home-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 51px); }
  aside { border-right: 1px solid var(--line); padding: 14px 10px; }
  .aside-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 0 8px 6px; }
  .app-link { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; }
  .app-link:hover { background: var(--card); }
  .app-link.active { background: var(--card); font-weight: 600; }
  .app-link .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  main { padding: 20px 28px 60px; max-width: 1000px; width: 100%; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  h3 { font-size: 13px; margin: 14px 0 6px; }
  .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 14px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  code, .mono, pre { font-family: var(--mono); font-size: 12.5px; }
  pre { margin: 8px 0 0; padding: 10px; background: var(--card); border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  button { white-space: nowrap; font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; resize: vertical; display: block; }
  textarea.code { font-family: var(--mono); font-size: 12.5px; line-height: 1.45; tab-size: 4; }
  .form-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .tag.write { color: var(--warn); }
  .tag.read { color: var(--ok); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--line); }
  .server-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .box { border-radius: 6px; padding: 10px 12px; margin: 10px 0; border: 1px solid transparent; }
  .box.ok { background: var(--ok-bg); border-color: var(--ok); }
  .box.error { background: var(--err-bg); border-color: var(--err); }
  .box.warn { background: var(--warn-bg); border-color: var(--warn); }
  .box.info { background: var(--info-bg); border-color: var(--accent); }
  .box pre { background: transparent; padding: 0; }
  .box strong { font-family: var(--mono); }
  .hint { margin-top: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 320px; overflow-wrap: anywhere; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 2px 0; }
  ul.log { list-style: none; padding: 0; margin: 0; }
  ul.log li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  ul.log li.error .msg { color: var(--err); }
  ul.log li.warn .msg { color: var(--warn); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab { font-family: var(--mono); font-size: 12px; padding: 3px 10px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .tab.empty:not(.active) { opacity: .55; }
  a { color: var(--accent); }
  .empty { text-align: center; padding: 60px 20px; }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
    .grid2 { grid-template-columns: 1fr; }
    #home-path { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#">neai</a>
  <span class="muted small mono" id="home-path"></span>
  <span class="spacer"></span>
  <button class="primary" id="new-app">New app</button>
</header>
<div class="layout">
  <aside>
    <div class="aside-title">Apps</div>
    <nav id="apps"></nav>
  </aside>
  <main id="main"></main>
</div>
<script>
"use strict";
// All page content is built with DOM APIs (textContent), never innerHTML: record data comes
// from callers and must not be able to inject markup into the developer's UI.

// logins: per app, {user, token} of whoever signed in through "Try a handler". Page memory only:
// a reload signs out, and the token is never written to storage.
const state = { config: null, current: null, lastRequest: "", logins: {} };
const $ = (sel) => document.querySelector(sel);

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

function put(el, ...children) {
  el.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));
  return el;
}

async function api(path, body) {
  const opts = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  try {
    const res = await fetch(path, opts);
    return await res.json();
  } catch (e) {
    return { ok: false, error: { code: "UI_UNREACHABLE", message: "can't reach the neai ui server: " + e.message } };
  }
}

const pretty = (v) => JSON.stringify(v, null, 2);
const shortHash = (hash) => (hash || "").replace("sha256:", "").slice(0, 10);
const clock = (iso) => (iso ? new Date(iso).toLocaleTimeString() : "");
const cell = (v) => (v === undefined || v === null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v));
const PLACEHOLDER = { string: "", integer: 1, number: 0, boolean: false, list: [], object: {} };
const signature = (args) => Object.entries(args).map(([n, s]) => `${n} (${s.type}${s.required ? "" : ", optional"})`).join(", ");
const accessText = (a) => (Array.isArray(a) ? a.join(" or ") : a);
const accessClass = (a) => (a === "public" ? "read" : Array.isArray(a) ? "write" : "");
const argsTemplate = (handler) => JSON.stringify(Object.fromEntries(
  Object.entries((handler && handler.args) || {}).filter(([, s]) => s.required).map(([n, s]) => [n, PLACEHOLDER[s.type]])));

function errorBox(err, ...extra) {
  return h("div", { class: "box error" },
    h("div", {}, h("strong", {}, err.code), " ", err.message),
    err.hint && h("div", { class: "hint small" }, "Hint: ", err.hint),
    err.details && h("details", {}, h("summary", {}, "details"), h("pre", {}, pretty(err.details))),
    ...extra);
}

function reviewBox(problems) {
  return h("div", { class: "box warn" },
    h("div", {}, "Safety check: deploy will be refused until these lines are removed."),
    h("ul", {}, problems.map((p) => h("li", { class: "small" }, `${p.file ? p.file + " " : ""}line ${p.line}: ${p.problem}`))));
}


async function loadApps() {
  const r = await api("/api/apps");
  const nav = $("#apps");
  put(nav);
  if (!r.ok) return nav.append(errorBox(r.error));
  if (!r.apps.length) nav.append(h("p", { class: "muted small", style: "padding: 0 8px" }, "No apps yet."));
  for (const a of r.apps) {
    nav.append(h("a", { href: "#app/" + a.name, class: "app-link" + (a.name === state.current ? " active" : "") },
      h("span", { class: "dot " + (a.running ? "on" : "off"), title: a.running ? "running" : "stopped" }),
      h("span", { class: "name" }, a.name),
      h("span", { class: "badge" }, a.version ? "v" + a.version : "none")));
  }
}


function showHome() {
  state.current = null;
  loadApps();
  put($("#main"), h("div", { class: "empty" },
    h("h1", {}, "Pick an app, or make one"),
    h("p", { class: "muted" }, "Each app is an app.json contract plus a handlers.py file, deployed and run by neai."),
    h("p", {}, h("button", { class: "primary", onclick: () => (location.hash = "#new") }, "New app")),
    !state.config.ai.enabled && h("p", { class: "muted small" },
      "Tip: set DEEPSEEK_API_KEY before starting ", h("code", {}, "neai ui"), " to generate apps from a description.")));
}


async function showApp(name) {
  state.current = name;
  loadApps();
  const main = $("#main");
  put(main, h("p", { class: "muted" }, "Loading..."));
  const r = await api("/api/apps/" + encodeURIComponent(name));
  if (!r.ok) return put(main, errorBox(r.error));
  const v = r.active_version;
  put(main, 
    h("div", { class: "title-row" },
      h("h1", {}, r.app.name),
      v ? h("span", { class: "badge", title: v.hash }, `version ${v.version} · ${shortHash(v.hash)}`)
        : h("span", { class: "badge" }, "no active version"),
      h("span", { class: "spacer" }),
      h("button", { onclick: () => (location.hash = "#edit/" + name) }, "Edit"),
      h("button", { onclick: () => showApp(name) }, "Refresh")),
    r.app.description && h("p", { class: "muted", style: "margin: 4px 0" }, r.app.description),
    serverRow(name, r.server, v),
    r.latest_rejected && h("div", {},
      h("h3", {}, "The latest definition was rejected", v ? ` (version ${v.version} is still active)` : ""),
      errorBox(r.latest_rejected.error)),
    callCard(name, r.handlers, r.server.running, r.auth),
    usersCard(name, Boolean(v)),
    h("div", { id: "panels" }, dataCard(r), activityCard(r.recent_logs)),
    contractCard(r));
}

async function refreshPanels(name) {
  const r = await api("/api/apps/" + encodeURIComponent(name));
  if (r.ok && $("#panels")) put($("#panels"), dataCard(r), activityCard(r.recent_logs));
}

function serverRow(name, server, version) {
  const startStop = async (action, button) => {
    button.disabled = true;
    button.textContent = action === "start" ? "Starting..." : "Stopping...";
    const r = await api(`/api/apps/${name}/${action}`, {});
    await showApp(name);
    if (!r.ok) $("#main").insertBefore(errorBox(r.error), $("#main").children[2]);
  };
  return h("div", { class: "server-row" },
    h("span", { class: "dot " + (server.running ? "on" : "off") }),
    server.running ? h("span", {}, "Running at ", h("code", {}, server.url), " ",
      h("a", { href: server.url + "/", target: "_blank", rel: "noopener" }, "Open the app's UI"))
                   : h("span", { class: "muted" }, "Server stopped"),
    server.running
      ? h("button", { onclick: (e) => startStop("stop", e.target) }, "Stop")
      : h("button", { class: "primary", disabled: !version, onclick: (e) => startStop("start", e.target) }, "Start server"));
}

function signInBox(name, auth, running) {
  const login = state.logins[name];
  if (login) {
    const signOut = async () => {
      await api(`/api/apps/${name}/logout`, { token: login.token });
      delete state.logins[name];
      showApp(name);
    };
    const rolesText = (user) => (user.roles.length ? "roles: " + user.roles.join(", ") : "no roles");
    const roles = h("span", { class: "muted small" }, rolesText(login.user));
    // Ask the app who this token belongs to now: roles may have changed, or the login been revoked.
    api(`/api/apps/${name}/me`, { token: login.token }).then((r) => {
      if (r.ok) {
        login.user = r.user;
        roles.textContent = rolesText(r.user);
      } else if (r.error && r.error.code === "AUTH_INVALID") {
        delete state.logins[name];
        showApp(name);
      }
    });
    return h("div", { class: "form-row" },
      h("span", {}, "Signed in as ", h("b", {}, login.user.username)), roles,
      h("button", { onclick: signOut }, "Sign out"));
  }
  const user = h("input", { size: 12, placeholder: "username", "aria-label": "username", autocomplete: "off" });
  const pass = h("input", { size: 16, type: "password", placeholder: "password", "aria-label": "password",
                            autocomplete: "off" });
  const out = h("span", { class: "small" });
  const go = async (action) => {
    const r = await api(`/api/apps/${name}/${action}`, { username: user.value.trim(), password: pass.value });
    pass.value = "";
    if (!r.ok) return put(out, h("span", { style: "color: var(--err)" }, `${r.error.code}: ${r.error.message}`));
    state.logins[name] = { user: r.user, token: r.token };
    showApp(name);
  };
  const closed = auth.signup !== "open";
  return h("div", {},
    h("div", { class: "form-row" }, user, pass,
      h("button", { class: "primary", disabled: !running, onclick: () => go("login") }, "Log in"),
      h("button", { disabled: !running || closed, onclick: () => go("signup"),
                    title: closed ? "sign-up is closed for this app: add accounts in Users below" : "" }, "Sign up"),
      out),
    h("div", { class: "muted small" },
      "Not signed in, so only public handlers will answer. Accounts belong to this app only."));
}

function callCard(name, handlers, running, auth) {
  const select = h("select", {}, handlers.map((x) =>
    h("option", { value: x.name }, `${x.name}  (${x.kind} · ${accessText(x.access)})`)));
  const args = h("textarea", { rows: 3, class: "code", spellcheck: "false", "aria-label": "args" });
  const sig = h("div", { class: "muted small" });
  const showArgs = () => {
    const handler = handlers.find((x) => x.name === select.value);
    args.value = argsTemplate(handler);
    sig.textContent = handler && handler.args
      ? "args: " + (signature(handler.args) || "none") : "args (JSON): not declared, so not checked by the platform";
  };
  select.addEventListener("change", showArgs);
  showArgs();
  const out = h("div");
  const run = async (e) => {
    let parsed;
    try {
      parsed = JSON.parse(args.value.trim() || "{}");
    } catch (err) {
      return put(out, errorBox({ code: "ARGS_INVALID", message: "args isn't valid JSON: " + err.message }));
    }
    const login = state.logins[name];
    e.target.disabled = true;
    const r = await api(`/api/apps/${name}/call`, { handler: select.value, args: parsed, token: login ? login.token : null });
    e.target.disabled = false;
    if (!r.ok && r.error.code === "AUTH_INVALID") delete state.logins[name];  // expired or logged out elsewhere
    put(out, r.ok ? h("pre", {}, pretty(r.result)) : errorBox(r.error));
    refreshPanels(name);
  };
  return h("section", { class: "card" },
    h("h2", {}, "Try a handler"),
    !running && h("p", { class: "muted small" }, "Start the server to sign in and call handlers."),
    signInBox(name, auth, running),
    h("div", { class: "form-row" }, select,
      h("button", { class: "primary", disabled: !running, onclick: run }, "Run")),
    sig, args, out);
}

function usersCard(name, hasVersion) {
  const sec = h("section", { class: "card" }, h("h2", {}, "Users"), h("p", { class: "muted small" }, "Loading..."));
  const load = async () => {
    const r = await api(`/api/apps/${encodeURIComponent(name)}/users`);
    if (!r.ok) return put(sec, h("h2", {}, "Users"), errorBox(r.error));
    const msg = h("div");
    const act = async (body) => {
      const res = await api(`/api/apps/${name}/users`, body);
      if (!res.ok) return put(msg, errorBox(res.error));
      const login = state.logins[name];
      if (login && login.user.username === body.username) showApp(name);  // the signed-in user changed
      else load();
    };
    const rows = r.users.map((u) => {
      const grantable = r.roles.filter((role) => !u.roles.includes(role));
      const pick = h("select", { "aria-label": "role to grant" }, grantable.map((role) => h("option", { value: role }, role)));
      const revoke = (role) => (e) => { e.preventDefault(); act({ action: "revoke", username: u.username, role }); };
      const remove = () => confirm(`Remove ${u.username}? Their sessions end; records they created stay.`)
        && act({ action: "remove", username: u.username });
      return h("tr", {},
        h("td", {}, u.username, u.locked && h("span", { class: "badge", style: "margin-left: 6px" }, "locked")),
        h("td", {}, u.roles.length
          ? u.roles.map((role) => h("span", { class: "tag", style: "margin-right: 4px" }, role, " ",
              h("a", { href: "#", title: `revoke ${role}`, onclick: revoke(role) }, "×")))
          : h("span", { class: "muted" }, "none")),
        h("td", {}, grantable.length ? h("span", { class: "form-row", style: "margin: 0" }, pick,
          h("button", { onclick: () => act({ action: "grant", username: u.username, role: pick.value }) }, "Grant")) : null),
        h("td", { class: "muted small" }, `${u.active_sessions} session${u.active_sessions === 1 ? "" : "s"}`),
        h("td", {}, u.locked && h("button", { onclick: () => act({ action: "unlock", username: u.username }) }, "Unlock"),
          " ", h("button", { onclick: remove }, "Remove")));
    });
    const newUser = h("input", { size: 12, placeholder: "username", "aria-label": "new username", autocomplete: "off" });
    const newPass = h("input", { size: 18, type: "password", placeholder: "password (8+ characters)",
                                 "aria-label": "new password", autocomplete: "new-password" });
    const boxes = r.roles.map((role) => ({ role, box: h("input", { type: "checkbox" }) }));
    const add = () => act({ action: "add", username: newUser.value.trim(), password: newPass.value,
                            roles: boxes.filter((b) => b.box.checked).map((b) => b.role) });
    put(sec,
      h("h2", {}, "Users"),
      h("p", { class: "muted small" }, `Sign-up is ${r.signup || "not set"}; roles in app.json: ${r.roles.join(", ") || "none"}. `,
        "This panel is the operator's view: the app's users sign in through the app's own server."),
      r.users.length
        ? h("div", { class: "table-wrap" }, h("table", {},
            h("thead", {}, h("tr", {}, ["user", "roles", "", "", ""].map((t) => h("th", {}, t)))),
            h("tbody", {}, rows)))
        : h("p", { class: "muted small" }, "No accounts yet."),
      hasVersion && h("div", { class: "form-row" }, newUser, newPass,
        boxes.map(({ role, box }) => h("label", { class: "small" }, box, " ", role)),
        h("button", { onclick: add }, "Add user")),
      msg);
  };
  load();
  return sec;
}

function dataCard(r) {
  const sec = h("section", { class: "card" }, h("h2", {}, "Data"));
  const collections = Object.entries(r.data);
  if (!collections.length) sec.append(h("p", { class: "muted small" }, "No collections."));
  for (const [coll, info] of collections) {
    const fields = ["id", ...Object.keys(r.schema[coll] || {})];
    sec.append(h("h3", {}, coll, " ", h("span", { class: "muted small" },
      `${info.count} record${info.count === 1 ? "" : "s"}`)));
    if (!info.records.length) {
      sec.append(h("p", { class: "muted small" }, "Empty."));
      continue;
    }
    sec.append(h("div", { class: "table-wrap" }, h("table", {},
      h("thead", {}, h("tr", {}, fields.map((f) => h("th", {}, f)))),
      h("tbody", {}, info.records.map((rec) => h("tr", {}, fields.map((f) => h("td", {}, cell(rec[f])))))))));
    if (info.showing) sec.append(h("p", { class: "muted small" }, info.showing));
  }
  return sec;
}

function activityCard(logs) {
  return h("section", { class: "card" },
    h("h2", {}, "Recent activity"),
    !logs.length ? h("p", { class: "muted small" }, "Nothing yet.")
      : h("ul", { class: "log" }, logs.map((l) => h("li", { class: l.level },
          h("span", { class: "muted mono small" }, clock(l.at)), " ",
          h("span", { class: "tag" }, l.event), " ",
          l.version && h("span", { class: "muted small" }, "v" + l.version + " "),
          l.caller && h("span", { class: "muted" }, l.caller + " · "),
          h("span", { class: "msg" }, l.message),
          l.data && h("details", {}, h("summary", {}, "data"), h("pre", {}, pretty(l.data)))))));
}

function contractCard(r) {
  return h("section", { class: "card" },
    h("h2", {}, "Contract"),
    h("div", { class: "grid2" },
      h("div", {}, h("h3", {}, "Handlers"), h("ul", { class: "plain" }, r.handlers.map((x) =>
        h("li", {}, h("code", {}, x.name), " ", h("span", { class: "tag " + x.kind }, x.kind), " ",
          h("span", { class: "tag " + accessClass(x.access), title: "who may call it" }, accessText(x.access)),
          x.args && h("div", { class: "muted small", style: "margin-left: 12px" }, signature(x.args) || "no arguments"))))),
      h("div", {}, h("h3", {}, "Collections"), Object.entries(r.schema).map(([c, fields]) =>
        h("div", {}, h("code", {}, c), h("ul", { class: "plain small", style: "margin: 2px 0 8px 12px" },
          Object.entries(fields).map(([f, spec]) => h("li", {}, f, " ",
            h("span", { class: "muted" }, spec.type + (spec.items ? ` of ${spec.items}` : "") + (spec.required ? "" : ", optional"))))))))),
    workflowsBlock(r.workflows || {}),
    h("p", { class: "muted small" }, `Accounts: sign-up ${r.auth.signup}, roles ${r.auth.roles.join(", ") || "none"}, `
      + `${r.auth.users} user${r.auth.users === 1 ? "" : "s"}.`),
    h("p", { class: "muted small" }, "Deployed from ", h("code", {}, r.app.source_dir || "unknown")));
}


function workflowsBlock(workflows) {
  const names = Object.keys(workflows);
  if (!names.length) return null;
  return h("div", {}, h("h3", {}, "Workflows"), names.map((n) => {
    const wf = workflows[n];
    const count = (step) => wf.records_per_step[step] || 0;
    const chain = wf.steps.map((s, i) => h("span", {},
      i ? h("span", { class: "muted" }, " → ") : null,
      h("code", {}, s.name),
      h("span", { class: "muted small" }, ` (${count(s.name)})`),
      s.by && h("span", { class: "tag", title: "who may pass this step" }, s.by.join(" or ")),
      s.skip_if && h("span", { class: "tag write", title: "skip_if " + JSON.stringify(s.skip_if) }, "skip rule"),
      s.on_enter && h("span", { class: "tag read", title: "on_enter hook in workflows.py" }, s.on_enter)));
    return h("div", { style: "margin: 4px 0 10px" },
      h("div", {}, h("b", {}, n), h("span", { class: "muted small" }, ` on ${wf.collection}.${wf.field}`),
        wf.description && h("div", { class: "muted small" }, wf.description)),
      h("div", { class: "small", style: "line-height: 2" }, chain),
      wf.exits.length ? h("div", { class: "muted small" }, "exits: ",
        wf.exits.map((x) => `${x} (${count(x)})`).join(", ")) : null);
  }));
}

const STANDARD_FILES = ["app.json", "handlers.py", "workflows.json", "workflows.py", "tests.json", "ui/index.html"];
const FILE_HELP = {
  "app.json": "The contract: data, handlers, who may call them, roles.",
  "handlers.py": "The handlers' code.",
  "workflows.json": "Optional: the steps records move through, with who may move them and skip rules.",
  "workflows.py": "Optional: the hooks and conditions workflows.json names.",
  "tests.json": "Optional: example calls and what they should return; every deploy runs them in a sandbox first.",
  "ui/index.html": "Optional: the app's own UI, served at /. Without it, the app gets a UI generated from its contract.",
};
const REQUIRED_FILES = ["app.json", "handlers.py"];

async function showEditor(mode, name) {
  state.current = mode === "change" ? name : null;
  let lastSent = null;  // the files this editor last deployed, so overwriting its own attempt isn't a conflict
  loadApps();
  let files = state.config.template;
  let target = state.config.apps_dir + "/<name in app.json>";
  if (mode === "change") {
    const r = await api("/api/apps/" + encodeURIComponent(name));
    if (!r.ok) return put($("#main"), errorBox(r.error));
    files = r.files || files;
    lastSent = r.files || null;  // what the folder held when the editor opened it
    target = r.app.source_dir || state.config.apps_dir + "/" + name;
  }
  const ai = state.config.ai;
  const texts = {};
  const holder = h("div");
  const help = h("div", { class: "muted small", style: "margin-bottom: 6px" });
  const tabBar = h("div", { class: "tabs" });
  let active = "app.json";
  const area = (n, text) => {
    const t = h("textarea", { class: "code", rows: 24, spellcheck: "false", "aria-label": n });
    t.value = text || "";
    t.addEventListener("input", () => renderTabs());
    texts[n] = t;
    return t;
  };
  [...new Set([...STANDARD_FILES, ...Object.keys(files)])].forEach((n) => area(n, files[n]));
  function renderTabs() {
    put(tabBar, Object.keys(texts).map((n) => h("button", {
      class: "tab" + (n === active ? " active" : "") + (texts[n].value.trim() ? "" : " empty"),
      title: texts[n].value.trim() ? n : `${n} (none yet)`, onclick: () => showTab(n) }, n)),
      h("button", { class: "tab", title: "add another file to the app's UI", onclick: addFile }, "+ UI file"));
  }
  function showTab(n) {
    active = n;
    put(holder, texts[n]);
    help.textContent = FILE_HELP[n] || `Part of the app's UI, served at /${n.slice(3)}.`;
    renderTabs();
  }
  function addFile() {
    const n = (window.prompt("Name of the UI file, e.g. style.css or app.js") || "").trim().replace(/^ui\//, "");
    if (!n) return;
    const key = "ui/" + n;
    if (!texts[key]) area(key, "");
    showTab(key);
  }
  function setFiles(newFiles) {
    for (const [n, text] of Object.entries(newFiles)) (texts[n] || area(n, "")).value = text;
    showTab(Object.keys(newFiles)[0] || active);
  }
  // Empty optional files mean "the app doesn't have this file": they aren't sent, and deploy removes them.
  const current = () => Object.fromEntries(Object.entries(texts).map(([n, t]) => [n, t.value])
    .filter(([n, v]) => v.trim() || REQUIRED_FILES.includes(n)));
  showTab(active);

  const aiOut = h("div");
  const result = h("div");
  const prompt = h("textarea", { rows: 3, placeholder: mode === "new"
    ? "Describe the app, e.g. \"a shared shopping list: anyone can add items, only the person who added an item can remove it\""
    : "Describe the change, e.g. \"add an optional due date to notes and a handler that lists overdue ones\"" });
  const genButton = h("button", { class: "primary", disabled: !ai.enabled }, `Generate with ${ai.provider}`);
  const uiButton = h("button", { disabled: !ai.enabled, title: "writes ui/index.html from the app's files; "
    + "the description box (optional) says what the UI should be like" }, "Generate UI");

  // Shows its progress on the button that was clicked and next to it (out), not somewhere off-screen.
  async function ask(button, busy, path, body, done, out) {
    const label = button.textContent;
    const others = [genButton, uiButton, deployButton].filter((b) => b !== button);
    button.disabled = true;
    button.textContent = busy;
    others.forEach((b) => (b.disabled = true));
    put(out, h("p", { class: "muted small" }, h("span", { class: "spinner" }),
      ` Asking ${ai.model}; this can take a minute.`));
    out.scrollIntoView({ block: "nearest", behavior: "smooth" });
    const before = current();
    const r = await api(path, body);
    button.disabled = false;
    button.textContent = label;
    others.forEach((b) => (b.disabled = b !== deployButton && !ai.enabled));
    if (!r.ok) return put(out, errorBox(r.error));
    const changed = Object.keys(r.files).filter((n) => (before[n] || "") !== r.files[n]);
    setFiles(r.files);
    const message = [h("div", { class: "box info" }, h("b", {}, "Draft ready. "), r.summary, " ",
        changed.length ? `Changed: ${changed.join(", ")}. ` : "Nothing changed. ", done),
      r.review && r.review.length ? reviewBox(r.review) : null];
    if (result.contains(out)) {
      put(result, message);  // a fix: the old error no longer applies to the new files
    } else {
      put(result);
      put(out, message);
    }
  }
  async function generate(error, button, out) {
    const request = prompt.value.trim() || state.lastRequest;
    if (!request && !error) return put(aiOut, h("p", { class: "muted small" }, "Describe what you want first."));
    state.lastRequest = request;
    const send = mode === "change" || error;
    const body = { request: request || "Fix the app so it deploys.", files: send ? current() : null, error: error || null };
    if (error) {
      await ask(button, "Fixing...", "/api/ai", body, "Review the changed tabs, then Deploy again.", out);
    } else {
      await ask(genButton, "Generating...", "/api/ai", body, "Review the files, then deploy.", aiOut);
    }
  }
  genButton.addEventListener("click", () => generate(null));
  uiButton.addEventListener("click", () => ask(uiButton, "Generating...", "/api/ai/ui",
    { request: prompt.value.trim(), files: current() }, "Review ui/index.html, then deploy.", aiOut));

  const deployButton = h("button", { class: "primary" }, "Deploy");
  async function deploy(overwrite) {
    deployButton.disabled = true;
    const sending = current();
    const r = await api("/api/deploy", { mode, app: name || null, files: sending, overwrite, previous: lastSent });
    deployButton.disabled = false;
    if (r.dir) lastSent = sending;  // the files reached the folder (deployed or rejected)
    if (!r.ok && r.error && ["APP_EXISTS", "SOURCE_CHANGED"].includes(r.error.code)) {
      if (confirm(`${r.error.message}.\n\n${r.error.hint || ""}`)) return deploy(true);
      return put(result, errorBox(r.error));
    }
    if (r.ok) {
      put(result, h("div", { class: "box ok" },
        h("div", {}, r.status === "unchanged" ? "No changes: this is already the active version."
                                              : `Deployed: ${r.app} is now on version ${r.version}.`),
        (r.warnings || []).map((w) => h("div", { class: "small", style: "color: var(--warn)" }, "Warning: " + w)),
        h("div", { class: "form-row" }, h("button", { onclick: () => (location.hash = "#app/" + r.app) }, `Open ${r.app}`))));
      loadApps();
      return;
    }
    const err = r.error || { code: "DEPLOY_FAILED", message: "deploy failed" };
    const fixOut = h("div");  // the fix's progress and result, right under its button; the error stays visible
    put(result,
      r.active_version ? h("p", { class: "muted small" }, `Rejected. Version ${r.active_version} is still active and serving.`) : null,
      errorBox(err, ai.enabled && h("div", { class: "form-row" },
        h("button", { class: "primary", onclick: (e) => generate(err, e.currentTarget, fixOut) }, "Fix with AI"),
        h("span", { class: "muted small" }, "sends this error and the files back to the model"))),
      fixOut);
  }
  deployButton.addEventListener("click", () => deploy(false));

  put($("#main"),
    h("div", { class: "title-row" },
      h("h1", {}, mode === "new" ? "New app" : `Edit ${name}`),
      h("span", { class: "spacer" }),
      mode === "change" && h("button", { onclick: () => (location.hash = "#app/" + name) }, "Back")),
    h("section", { class: "card" },
      h("h2", {}, "Build with AI"),
      ai.enabled
        ? [prompt, h("div", { class: "form-row" }, genButton, uiButton, h("span", { class: "muted small" }, `model: ${ai.model}`)), aiOut]
        : h("p", { class: "muted small" }, "Set DEEPSEEK_API_KEY in your shell and restart ", h("code", {}, "neai ui"),
            " to generate apps from a description. You can still write the files yourself below.")),
    h("section", { class: "card" },
      h("h2", {}, "Files"), tabBar, help, holder,
      h("div", { class: "form-row" }, deployButton,
        h("span", { class: "muted small" }, "Code is checked for unsafe calls, then the platform validates everything before it goes live.")),
      h("div", { class: "muted small" }, "Deploy saves these files to ", h("code", {}, target),
        " (the folder ", h("code", {}, "neai deploy"), " would use) and deploys into the database at ", h("code", {}, state.config.database), "."),
      result));
}


function route() {
  const [view, name] = location.hash.slice(1).split("/");
  if (view === "app" && name) showApp(decodeURIComponent(name));
  else if (view === "edit" && name) showEditor("change", decodeURIComponent(name));
  else if (view === "new") showEditor("new");
  else showHome();
}

(async function init() {
  const config = await api("/api/config");
  if (!config.ok) return put($("#main"), errorBox(config.error));
  state.config = config;
  $("#home-path").textContent = config.database;
  $("#new-app").addEventListener("click", () => (location.hash = "#new"));
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
