<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d8dee4; --card: #f6f8fa;
    --accent: #0969da; --accent-fg: #ffffff; --ok-bg: #dafbe1; --ok: #1a7f37;
    --err: #cf222e; --err-bg: #ffebe9; --warn: #9a6700;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --card: #161b22;
      --accent: #4493f8; --accent-fg: #0d1117; --ok-bg: #12261e; --ok: #3fb950;
      --err: #f85149; --err-bg: #2d1214; --warn: #d29922;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  .spacer { flex: 1; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 20px 60px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
  .card h2 { font-size: 15px; margin: 0; font-family: var(--mono); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .field { display: flex; flex-direction: column; gap: 2px; min-width: 160px; }
  .field label { font-size: 12px; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  textarea { font-family: var(--mono); font-size: 12.5px; width: 100%; min-height: 60px; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:disabled { opacity: .5; cursor: default; }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; font-family: system-ui, sans-serif; }
  .error { background: var(--err-bg); border: 1px solid var(--err); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .error b { font-family: var(--mono); }
  .result { margin-top: 8px; overflow-x: auto; }
  pre { margin: 0; padding: 8px; background: var(--card); border-radius: 6px; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  th { color: var(--muted); font-size: 12px; }
  .steps { font-family: var(--mono); font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Loading...</h1>
  <span class="muted small" id="description"></span>
  <span class="spacer"></span>
  <div id="auth"></div>
</header>
<main id="main"></main>
<footer>Generated by neai from this app's contract. The app can replace it with its own <code>ui/index.html</code>.</footer>
<script src="/_neai/sdk.js"></script>
<script>
"use strict";
// Everything is built with DOM APIs and textContent, never innerHTML: results come from other
// users and must not be able to inject markup.

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  }
  return el;
}
const put = (el, ...children) => el.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false));
const accessText = (a) => (Array.isArray(a) ? a.join(" or ") : a);

let contract = null;
let user = null;

function canCall(handler) {
  const a = handler.access;
  if (a === "public") return true;
  if (!user) return false;
  if (a === "user") return true;
  return a.some((role) => user.roles.includes(role));
}

function whyNot(handler) {
  return !user ? "log in to use this" : `needs the role ${accessText(handler.access)}`;
}

function errorBox(e) {
  return h("div", { class: "error" }, h("b", {}, e.code || "ERROR"), " ", e.message,
    e.hint && h("div", { class: "small" }, "Hint: ", e.hint));
}

function cell(v) {
  if (v === null || v === undefined) return "";
  return typeof v === "object" ? JSON.stringify(v) : String(v);
}

function renderValue(v) {
  if (Array.isArray(v) && v.length && v.every((x) => x && typeof x === "object" && !Array.isArray(x))) {
    const cols = [...new Set(v.flatMap((x) => Object.keys(x)))];
    return h("table", {}, h("thead", {}, h("tr", {}, cols.map((c) => h("th", {}, c)))),
      h("tbody", {}, v.map((row) => h("tr", {}, cols.map((c) => h("td", {}, cell(row[c])))))));
  }
  if (Array.isArray(v) && !v.length) return h("p", { class: "muted small" }, "Nothing here yet.");
  if (v && typeof v === "object" && !Array.isArray(v)) {
    return h("table", {}, h("tbody", {}, Object.entries(v).map(([k, x]) =>
      h("tr", {}, h("th", {}, k), h("td", {}, cell(x))))));
  }
  return h("pre", {}, cell(v));
}

function inputFor(name, spec) {
  const id = "f-" + Math.random().toString(36).slice(2);
  let input;
  if (spec.type === "boolean") {
    input = h("select", { id }, spec.required ? null : h("option", { value: "" }, "(leave out)"),
      h("option", { value: "true" }, "true"), h("option", { value: "false" }, "false"));
  } else if (spec.type === "list" || spec.type === "object") {
    input = h("textarea", { id, placeholder: spec.type === "list" ? "[...] as JSON" : "{...} as JSON" });
  } else {
    input = h("input", { id, type: spec.type === "string" ? "text" : "number",
                         step: spec.type === "integer" ? "1" : "any" });
  }
  if (spec.default !== undefined) input.placeholder = "default: " + JSON.stringify(spec.default);
  const read = () => {
    const raw = input.value;
    if (raw === "") {
      if (spec.required && spec.default === undefined) throw new Error(`${name} is required`);
      return undefined;
    }
    if (spec.type === "boolean") return raw === "true";
    if (spec.type === "integer" || spec.type === "number") return Number(raw);
    if (spec.type === "list" || spec.type === "object") {
      try { return JSON.parse(raw); } catch (e) { throw new Error(`${name} isn't valid JSON`); }
    }
    return raw;
  };
  const label = h("label", { for: id }, name, spec.required ? " *" : "", h("span", { class: "muted" }, ` (${spec.type})`));
  return { el: h("div", { class: "field" }, label, input), read };
}

function handlerCard(handler) {
  const fields = handler.args ? Object.entries(handler.args).map(([n, spec]) => [n, inputFor(n, spec)]) : null;
  const raw = fields ? null : h("textarea", { placeholder: "args as JSON, e.g. {}" });
  const out = h("div", { class: "result" });
  const run = async (e) => {
    let args = {};
    try {
      if (fields) {
        for (const [n, f] of fields) {
          const v = f.read();
          if (v !== undefined) args[n] = v;
        }
      } else if (raw.value.trim()) {
        args = JSON.parse(raw.value);
      }
    } catch (err) {
      return put(out, errorBox({ code: "ARGS_INVALID", message: err.message }));
    }
    e.target.disabled = true;
    try {
      put(out, renderValue(await neai.call(handler.name, args)));
      if (handler.kind === "write") refreshReads();
    } catch (err) {
      put(out, errorBox(err));
    } finally {
      e.target.disabled = false;
    }
  };
  const card = h("section", { class: "card", "data-kind": handler.kind, "data-name": handler.name },
    h("h2", {}, handler.name, h("span", { class: "tag" }, handler.kind), h("span", { class: "tag" }, accessText(handler.access))),
    handler.description && h("div", { class: "muted small" }, handler.description),
    fields ? (fields.length ? h("div", { class: "row" }, fields.map(([, f]) => f.el)) : null) : raw,
    h("div", { class: "row" }, h("button", { class: handler.kind === "write" ? "primary" : "", onclick: run },
      handler.kind === "write" ? "Run" : "Show")),
    out);
  card.run = run;
  return card;
}

// After a write, refresh read handlers that take no arguments (e.g. "list_notes"), so lists stay current.
function refreshReads() {
  document.querySelectorAll('section[data-kind="read"][data-auto]').forEach((card) => card.run({ target: {} }));
}

function workflowsBox() {
  const flows = Object.entries(contract.workflows || {});
  if (!flows.length) return null;
  return h("section", { class: "card" }, h("h2", {}, "Workflows"), flows.map(([name, wf]) =>
    h("div", { style: "margin-top: 6px" },
      h("b", {}, name), h("span", { class: "muted small" }, ` (${wf.collection}.${wf.field})`),
      h("div", { class: "steps" }, wf.steps.map((s) => s.name + (s.by ? ` [${s.by.join("/")}]` : "")).join(" → ")),
      wf.exits.length ? h("div", { class: "muted small" }, "can also end as: " + wf.exits.join(", ")) : null)));
}

function authBox() {
  const box = document.getElementById("auth");
  if (user) {
    return put(box, h("span", { class: "row", style: "margin: 0" },
      h("span", {}, "Signed in as ", h("b", {}, user.username)),
      user.roles.length ? h("span", { class: "muted small" }, user.roles.join(", ")) : null,
      h("button", { onclick: async () => { await neai.logout(); } }, "Log out")));
  }
  const name = h("input", { placeholder: "username", "aria-label": "username", autocomplete: "username", size: 12 });
  const pass = h("input", { placeholder: "password", "aria-label": "password", type: "password",
                            autocomplete: "current-password", size: 14 });
  const msg = h("span", { class: "small", style: "color: var(--err)" });
  const go = (fn) => async () => {
    try {
      await fn(name.value.trim(), pass.value);
    } catch (e) {
      msg.textContent = e.message;
    }
  };
  put(box, h("span", { class: "row", style: "margin: 0" }, name, pass,
    h("button", { class: "primary", onclick: go(neai.login) }, "Log in"),
    contract.auth.signup === "open" ? h("button", { onclick: go(neai.signup) }, "Sign up") : null, msg));
}

async function render() {
  user = await neai.me();
  authBox();
  const usable = contract.handlers.filter(canCall);
  const blocked = contract.handlers.filter((x) => !canCall(x));
  const cards = usable.map(handlerCard);
  put(document.getElementById("main"),
    !user && h("p", { class: "muted" }, contract.auth.signup === "open"
      ? "Log in or sign up (top right) to use everything this app offers."
      : "Log in (top right). Accounts for this app are created by its operator."),
    cards,
    blocked.length ? h("details", { class: "card" },
      h("summary", {}, `${blocked.length} more action${blocked.length === 1 ? "" : "s"} not available to you`),
      h("ul", {}, blocked.map((x) => h("li", {}, h("code", {}, x.name), h("span", { class: "muted small" }, " " + whyNot(x)))))) : null,
    workflowsBox());
  cards.forEach((card) => {
    const handler = usable.find((x) => x.name === card.dataset.name);
    const needsInput = handler.args ? Object.values(handler.args).some((a) => a.required && a.default === undefined) : false;
    if (handler.kind === "read" && !needsInput) {
      card.dataset.auto = "1";
      card.run({ target: {} });
    }
  });
}

(async function init() {
  try {
    contract = await neai.contract();
  } catch (e) {
    return put(document.getElementById("main"), errorBox(e));
  }
  document.title = contract.app;
  document.getElementById("title").textContent = contract.app;
  document.getElementById("description").textContent = contract.description || "";
  neai.onAuthChange(render);
  render();
})();
</script>
</body>
</html>
