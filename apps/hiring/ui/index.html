<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiring</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Hiring</h1>
  <span class="spacer"></span>
  <div id="auth"></div>
</header>
<div id="toast" role="status"></div>
<main>
  <section id="jobs"></section>
  <section id="mine"></section>
  <section id="pipeline"></section>
</main>
<script src="/_neai/sdk.js"></script>
<script>
"use strict";
// The hiring app's own UI. It only talks to its server through window.neai (sdk.js), and builds
// the page with DOM APIs (never innerHTML), because candidates' text comes from other people.

const $ = (id) => document.getElementById(id);
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const put = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((c) => c != null && c !== false));
const money = (n) => "₹" + n.toLocaleString("en-IN");

let flow = null;     // the hiring workflow from the contract: steps, who passes each, exits
let user = null;
const isStaff = () => Boolean(user && user.roles.some((r) => r === "recruiter" || r === "interviewer"));
const isRecruiter = () => Boolean(user && user.roles.includes("recruiter"));
const mayPass = (stepName) => {
  const step = flow.steps.find((s) => s.name === stepName);
  return Boolean(user && step && (!step.by || step.by.some((r) => user.roles.includes(r))));
};

function toast(message, kind) {
  const t = $("toast");
  t.textContent = message;
  t.className = "show " + (kind || "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.className = ""), 4000);
}

async function act(fn, done) {
  try {
    const result = await fn();
    if (done) toast(done(result), "ok");
    await render();
  } catch (e) {
    toast(e.code ? `${e.code}: ${e.message}` : e.message, "err");
  }
}

function authBox() {
  if (user) {
    return put($("auth"), h("span", { class: "row" },
      h("span", {}, "Signed in as ", h("b", {}, user.username)),
      user.roles.length ? h("span", { class: "pill" }, user.roles.join(", ")) : null,
      h("button", { onclick: () => neai.logout() }, "Log out")));
  }
  const name = h("input", { placeholder: "username", "aria-label": "username", size: 11, autocomplete: "username" });
  const pass = h("input", { placeholder: "password", "aria-label": "password", type: "password", size: 13,
                            autocomplete: "current-password" });
  const go = (fn) => () => act(() => fn(name.value.trim(), pass.value));
  put($("auth"), h("span", { class: "row" }, name, pass,
    h("button", { class: "primary", onclick: go(neai.login) }, "Log in"),
    h("button", { onclick: go(neai.signup) }, "Sign up")));
}

async function jobsSection() {
  const jobs = await neai.call("list_jobs");
  const postForm = () => {
    const title = h("input", { placeholder: "job title", "aria-label": "job title", size: 22 });
    const level = h("select", { "aria-label": "level" }, ["SDE1", "SDE2", "SDE3"].map((l) => h("option", {}, l)));
    return h("div", { class: "row" }, title, level, h("button", { class: "primary", onclick: () =>
      act(() => neai.call("post_job", { title: title.value, level: level.value }), (j) => `Posted "${j.title}"`) }, "Post a job"));
  };
  const applyBox = (job) => {
    const years = h("input", { type: "number", min: "0", step: "0.5", placeholder: "years", "aria-label": "years of experience", size: 5 });
    return h("span", { class: "row" }, years, h("button", { class: "primary", onclick: () =>
      act(() => neai.call("apply", { job_id: job.id, experience_years: Number(years.value || 0) }),
          (a) => `Applied: you're in the "${a.stage}" round`) }, "Apply"));
  };
  put($("jobs"), h("h2", {}, "Open jobs"),
    isRecruiter() ? postForm() : null,
    jobs.length ? h("div", { class: "grid" }, jobs.map((job) => h("div", { class: "card" },
      h("div", { class: "title" }, job.title), h("span", { class: "pill" }, job.level),
      !user ? h("div", { class: "muted small" }, "Log in to apply") : null,
      user && !isStaff() ? applyBox(job) : null,
      isRecruiter() ? h("div", {}, h("button", { onclick: () =>
        act(() => neai.call("close_job", { job_id: job.id }), () => `Closed "${job.title}"`) }, "Close")) : null)))
      : h("p", { class: "muted" }, "No open jobs right now."));
}

function tracker(stage, moves) {
  const skipped = new Set(moves.flatMap((m) => m.skipped || []));
  const reached = new Set(moves.map((m) => m.to));
  const exited = flow.exits.includes(stage);
  return h("ol", { class: "tracker" }, flow.steps.map((s) => {
    let state = "todo";
    if (skipped.has(s.name)) state = "skipped";
    else if (s.name === stage) state = "current";
    else if (reached.has(s.name)) state = "done";
    return h("li", { class: state, title: state === "skipped" ? "skipped by a rule" : state },
      s.name, state === "skipped" ? h("small", {}, " skipped") : null);
  }), exited ? h("li", { class: "exit" }, stage) : null);
}

async function mineSection() {
  if (!user || isStaff()) return put($("mine"));
  const apps = await neai.call("my_applications");
  const withMoves = await Promise.all(apps.map(async (a) => ({ ...a, moves: (await neai.call("history", { id: a.id })).moves })));
  put($("mine"), h("h2", {}, "My applications"),
    withMoves.length ? withMoves.map((a) => {
      const finished = a.stage === "hired" || flow.exits.includes(a.stage);
      return h("div", { class: "card wide" },
        h("div", { class: "row" }, h("span", { class: "title" }, a.job_title || `job ${a.job_id}`),
          h("span", { class: "pill" }, a.level), h("span", { class: "muted small" }, `${a.experience_years} years`),
          h("span", { class: "spacer" }),
          !finished ? h("button", { onclick: () => confirm("Withdraw this application?") &&
            act(() => neai.call("withdraw", { id: a.id }), () => "Application withdrawn") }, "Withdraw") : null),
        tracker(a.stage, a.moves),
        a.offer ? h("div", { class: "offer" }, `Offer: ${money(a.offer.salary)} a year (${a.offer.level})`) : null);
    }) : h("p", { class: "muted" }, "You haven't applied to anything yet."));
}

async function pipelineSection() {
  if (!isStaff()) return put($("pipeline"));
  const apps = await neai.call("list_applications");
  const open = flow.steps.slice(0, -1);
  const done = [flow.steps[flow.steps.length - 1].name, ...flow.exits];
  const card = (a) => {
    const historyBox = h("div");
    const showHistory = async () => {
      const { moves } = await neai.call("history", { id: a.id });
      put(historyBox, h("ul", { class: "history" }, moves.map((m) => h("li", {},
        `${m.from ? m.from + " → " : ""}${m.to}`, m.skipped.length ? ` (skipped ${m.skipped.join(", ")})` : "",
        h("span", { class: "muted" }, ` by ${m.by || "?"}`), m.note ? h("em", {}, ` "${m.note}"`) : null))));
    };
    const reason = () => prompt("Reason (optional, the candidate's history shows it):") || undefined;
    return h("div", { class: "card" },
      h("div", { class: "title" }, a.candidate), h("span", { class: "pill" }, a.level),
      h("span", { class: "muted small" }, ` ${a.experience_years} yrs`),
      h("div", { class: "row" },
        h("button", { class: "primary", disabled: !mayPass(a.stage),
                      title: mayPass(a.stage) ? "" : "another role passes this round",
                      onclick: () => act(() => neai.call("pass_round", { id: a.id }),
                        (m) => `${a.candidate}: ${m.from} → ${m.to}` + (m.skipped.length ? ` (skipped ${m.skipped.join(", ")})` : "")) },
          "Pass"),
        h("button", { onclick: () => act(() => neai.call("reject", { id: a.id, note: reason() }), () => `${a.candidate} rejected`) }, "Reject"),
        h("a", { href: "#", onclick: (e) => { e.preventDefault(); showHistory(); } }, "history")),
      historyBox);
  };
  put($("pipeline"), h("h2", {}, "Pipeline"),
    h("div", { class: "board" }, open.map((s) => {
      const here = apps.filter((a) => a.stage === s.name);
      return h("div", { class: "column" }, h("h3", {}, s.name, h("span", { class: "muted small" }, ` ${here.length}`)),
        s.by ? h("div", { class: "muted small" }, "passed by " + s.by.join(" or ")) : null,
        here.map(card));
    })),
    h("p", { class: "muted small" }, "Finished: ", done.map((n) => `${n} ${apps.filter((a) => a.stage === n).length}`).join(" · ")));
}

async function render() {
  user = await neai.me();
  authBox();
  await jobsSection();
  await mineSection();
  await pipelineSection();
}

(async function init() {
  try {
    const contract = await neai.contract();
    flow = contract.workflows.hiring;
    neai.onAuthChange(() => render().catch((e) => toast(e.message, "err")));
    await render();
  } catch (e) {
    toast(e.code ? `${e.code}: ${e.message}` : e.message, "err");
  }
})();
</script>
</body>
</html>
